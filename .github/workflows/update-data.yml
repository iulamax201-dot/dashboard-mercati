name: Aggiorna dati mercati

on:
  schedule:
    # ogni 15 minuti, su minuti "spaiati" (orario UTC) per ridurre i ritardi
    # dello scheduler di GitHub, che è best-effort e congestionato sugli
    # orari tondi (:00/:15/:30/:45).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}   # avvio manuale dal tab Actions
  push:
    branches: [claude/sei-pronto-0sapn7, main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica dati e calcola analisi
        run: python scripts/fetch_data.py

      - name: Scarica titoli (seconda pagina)
        continue-on-error: true
        run: python scripts/fetch_stocks.py

      - name: Commit se ci sono aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data.json docs/stocks.json; then
            echo "Nessuna variazione nei dati."
            exit 0
          fi
          git add docs/data.json docs/stocks.json
          git commit -m "chore: aggiornamento dati mercati [skip ci]"
          # commit PRIMA di rebasare; poi integra eventuali push concorrenti
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "push ok"; exit 0
            fi
            echo "collisione, retry $i"; sleep 4
          done
          echo "push fallito dopo i retry"; exit 1
