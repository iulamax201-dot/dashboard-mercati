name: Aggiorna titoli (2 volte al giorno)

on:
  schedule:
    # due volte al giorno (orario UTC), su minuti "spaiati" per ridurre i
    # ritardi dello scheduler di GitHub (best-effort):
    #  - 12:20 UTC  → ~14:20 in Italia (mattina USA / metà giornata Europa)
    #  - 21:20 UTC  → ~23:20 in Italia (dopo la chiusura di Wall Street)
    - cron: "20 12,21 * * *"
  workflow_dispatch: {}   # avvio manuale dal tab Actions
  push:
    branches: [claude/sei-pronto-0sapn7, main]
    paths:
      - "scripts/fetch_stocks.py"
      - "scripts/stock_analysis.py"
      - "scripts/seed_stocks.py"
      - ".github/workflows/update-stocks.yml"

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica titoli e calcola analisi
        run: python scripts/fetch_stocks.py

      - name: Commit se ci sono aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/stocks.json; then
            echo "Nessuna variazione nei titoli."
            exit 0
          fi
          git add docs/stocks.json
          git commit -m "chore: aggiornamento titoli [skip ci]"
          # commit PRIMA di rebasare; poi integra eventuali push concorrenti
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "push ok"; exit 0
            fi
            echo "collisione, retry $i"; sleep 4
          done
          echo "push fallito dopo i retry"; exit 1
